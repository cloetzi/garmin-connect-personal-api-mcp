plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - vendor/**/*

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Exclude:
    - test/**/*

Layout/LineLength:
  Max: 150

Metrics/AbcSize:
  Max: 30
  Exclude:
    - test/**/*

Metrics/MethodLength:
  Max: 25
  Exclude:
    - test/**/*

Metrics/ClassLength:
  Max: 150
  Exclude:
    - test/**/*

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

Metrics/BlockLength:
  Exclude:
    - test/**/*

Metrics/ParameterLists:
  CountKeywordArgs: false

Minitest/MultipleAssertions:
  Max: 8
